name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vehicle_management_test
          POSTGRES_USER: vehicle_management
          POSTGRES_PASSWORD: vehicle_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vehicle_management -d vehicle_management_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vehicle_management:vehicle_management_test@localhost:5432/vehicle_management_test?schema=public
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema and generate client
        run: |
          pnpm db:format
          pnpm db:generate

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build production artifacts
        run: pnpm build

      - name: Install Chromium
        run: pnpm --filter @vms/web exec playwright install --with-deps chromium

      - name: Run browser smoke test
        run: pnpm test:e2e
